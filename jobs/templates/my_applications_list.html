<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>My applications</title></head>
<body>
  {% for application in my_applications %}
    <article><a href="{% url 'job_detail' application.job.pk %}">{{ application.job.title }}</a></article>
  {% empty %}
    <p>You have not applied for any jobs.</p>
  {% endfor %}
</body>
</html>

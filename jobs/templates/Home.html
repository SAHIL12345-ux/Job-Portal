<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Portal - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            padding: 50px 60px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            font-size: 32px;
            color: #1e293b;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
        }

        .btn-primary {
            background: #4f46e5;
            color: #ffffff;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Job Portal</h1>
        <p>Find your dream job or post a job opening!</p>
        <div class="btn-group">
            <a href="{% url 'job_list' %}" class="btn btn-primary">View Jobs</a>
            <a href="/admin/" class="btn btn-secondary">Admin Panel</a>
        </div>
    </div>
</body>
</html>
